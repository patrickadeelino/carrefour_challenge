name: carrefour-challenge

# Cada build também recebe o pacote compartilhado usado pelos apps.
services:
  ocr-mcp:
    image: carrefour-challenge-ocr-mcp:dev
    build:
      context: ./apps/ocr_mcp
      dockerfile: Dockerfile
      target: dev
      additional_contexts:
        observability: ./packages/carrefour_observability
    init: true
    environment:
      CARREFOUR_IMAGE_STORAGE_PATH: /var/run/carrefour/images
      CARREFOUR_OCR_ALLOWED_HOSTS: ocr-mcp:8000
      # A credencial é injetada em execução e não entra na imagem.
      GOOGLE_CLOUD_VISION_API_KEY: ${GOOGLE_CLOUD_VISION_API_KEY:-}
    volumes:
      # O OCR só precisa ler as imagens gravadas pelo runtime.
      - type: volume
        source: image-storage
        target: /var/run/carrefour/images
        read_only: true
    restart: unless-stopped

  rag-mcp:
    image: carrefour-challenge-rag-mcp:dev
    build:
      context: ./apps/rag_mcp
      dockerfile: Dockerfile
      target: dev
      additional_contexts:
        observability: ./packages/carrefour_observability
    init: true
    environment:
      CARREFOUR_RAG_ALLOWED_HOSTS: rag-mcp:8000
    restart: unless-stopped

  assistant-runtime:
    image: carrefour-challenge-assistant-runtime:dev
    build:
      context: ./apps/runtime
      dockerfile: Dockerfile
      target: dev
      additional_contexts:
        observability: ./packages/carrefour_observability
    # Mantém permissão de escrita nos arquivos do bind mount do host.
    group_add:
      - "${CARREFOUR_RUNTIME_GID:-1000}"
    working_dir: /workspace
    init: true
    # Deixa o container disponível para comandos via `docker compose exec`.
    command: ["sleep", "infinity"]
    environment:
      CARREFOUR_IMAGE_STORAGE_PATH: /var/run/carrefour/images
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_API_USE_CLIENT_CERTIFICATE: "false"
    volumes:
      - image-storage:/var/run/carrefour/images
      - type: bind
        source: .
        target: /workspace
        bind:
          # Evita criar um diretório vazio se a raiz do projeto não existir.
          create_host_path: false
    restart: unless-stopped

volumes:
  image-storage:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      # Limita o volume em memória e restringe acesso ao usuário app.
      o: size=64m,uid=10001,gid=10001,mode=0700
