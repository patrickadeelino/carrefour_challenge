[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "carrefour-rag-mcp"
version = "0.1.0"
description = "Catálogo fictício e recuperação de exames do Carrefour Challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "carrefour-observability",
    "mcp>=2,<3",
    "pydantic>=2,<3",
    "rapidfuzz>=3,<4",
    "starlette>=1,<2",
    "uvicorn>=0.34,<1",
]

[tool.uv.sources]
carrefour-observability = { path = "../../packages/carrefour_observability", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"
pythonpath = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["carrefour_rag_mcp"]

[tool.coverage.report]
show_missing = true
precision = 1

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "C90", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.11"
files = ["src/carrefour_rag_mcp"]
strict = true
warn_unused_configs = true
show_error_codes = true

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==8.3.5",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]
