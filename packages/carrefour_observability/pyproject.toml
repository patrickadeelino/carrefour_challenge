[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "carrefour-observability"
version = "0.1.0"
description = "Utilitários compartilhados de observabilidade do Carrefour Challenge"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-instrumentation-asgi>=0.63b0,<1",
    "opentelemetry-instrumentation-httpx>=0.63b0,<1",
    "opentelemetry-sdk>=1.39,<2",
]
